name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vite:
    name: Lint, build, SEO selftests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (Vite)
        run: npm run build
      - name: SEO selftests
        run: npm run test:seo
