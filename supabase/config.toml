# Linked supabase.com project (do NOT cancel until Cloud cutover succeeds).
# After Enable Cloud, Lovable assigns a new project_id; update this then.
project_id = "zpddlphtoeluytrejioj"

[functions.ai-health-assistant]
verify_jwt = true

[functions.sync-calendar-availability]
verify_jwt = true

[functions.symptom-severity-evaluator]
verify_jwt = true

# Gateway JWT check accepts the public anon key, so this function enforces
# admin JWT (is_blog_admin) or PRACTITIONER_INVITE_TOKEN itself.
[functions.create-practitioner]
verify_jwt = false

# Public directional assistant. Auth is consent_version + origin allow-list
# + per-isolate rate limit in the function (not a substitute for gateway quotas).
[functions.analyze-health-concern]
verify_jwt = false

# Public XML sitemap. Live deploy already has verify_jwt=false; this was
# missing from config, so a Cloud redeploy would have defaulted to JWT-on
# and broken Google's blog crawl.
[functions.blog-sitemap]
verify_jwt = false
